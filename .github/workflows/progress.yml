name: Progress checklist

# Regenerates plan/PROGRESS.md from plan/modules.toml and open "port: <unit id>" PRs,
# and publishes it on the `progress` branch (main is protected and only changes
# through PRs). Read it at https://github.com/bherbruck/solidcore/blob/progress/plan/PROGRESS.md
on:
  push:
    branches: [main]
    paths: [plan/modules.toml, harness/plan/progress.py]
  pull_request_target:
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: progress
  cancel-in-progress: false

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      # Always main: never check out or run PR code with a write token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned: this job has contents: write)
        with:
          ref: main
      - name: Regenerate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/plan/progress.py --prs
      - name: Publish to the progress branch if changed
        run: |
          cp plan/PROGRESS.md "$RUNNER_TEMP/PROGRESS.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin progress 2>/dev/null; then
            git checkout -q -B progress FETCH_HEAD
          else
            git checkout -q --orphan progress
            git rm -rq --cached . && git clean -fdq -e .git
          fi
          mkdir -p plan
          cp "$RUNNER_TEMP/PROGRESS.md" plan/PROGRESS.md
          git add plan/PROGRESS.md
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git commit -q -m "plan/PROGRESS.md: regenerate"
          git push origin HEAD:progress
